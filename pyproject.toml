[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topofab"
version = "0.1.0"
description = "Plotter-ready contour maps and 3D-printable terrain from elevation data"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "contourpy>=1.2",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pillow>=10.0",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "osmium>=4.0",
]

[tool.setuptools]
packages = ["server"]
